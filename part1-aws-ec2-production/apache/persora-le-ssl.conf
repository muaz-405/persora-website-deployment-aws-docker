# /etc/httpd/conf.d/persora-le-ssl.conf
# Certbot (--apache) generates this file automatically. Shown here in its standard form for reference.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName  persora.ae
    ServerAlias www.persora.ae
    DocumentRoot /var/www/html

    SSLCertificateFile    /etc/letsencrypt/live/persora.ae/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/persora.ae/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
