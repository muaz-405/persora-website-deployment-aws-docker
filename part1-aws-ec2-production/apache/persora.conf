# /etc/httpd/conf.d/persora.conf  (Amazon Linux 2023, Apache 2.4)
# HTTP virtual host: permanently redirects everything to HTTPS.
# NOTE: rebuilt for this repository (standard Certbot-style redirect); the original file was not kept.

<VirtualHost *:80>
    ServerName  persora.ae
    ServerAlias www.persora.ae
    DocumentRoot /var/www/html

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =persora.ae [OR]
    RewriteCond %{SERVER_NAME} =www.persora.ae
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
