# NOTE: rebuilt for this repository from the project steps (the original file was not kept).
# /etc/nginx/conf.d/default.conf inside the persora-secure container

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/persora.crt;
    ssl_certificate_key /etc/nginx/ssl/persora.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }
}
